name: Sentix Render

on:
  repository_dispatch:
    types: [sentix-render]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (for manual test)"
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Install edge-tts
        run: pip install --quiet edge-tts

      - name: Write payload.json + data.json from dispatch payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > payload.json
          jq '.data' payload.json > data.json
          echo "Title:" && jq -r '.title' data.json
          echo "Scenes:" && jq '.scenes | length' data.json

      - name: Generate Bengali voiceover (Edge-TTS) with word-level captions
        run: |
          jq -r '.full_script' data.json > narration.txt
          python3 .github/workflows/scripts/tts.py --text-file narration.txt --voice bn-BD-PradeepNeural --out voice.mp3 --captions captions.json
          ls -la voice.mp3 captions.json

      - name: Localize assets (Pexels / Pollinations) + pick BGM
        run: python3 .github/workflows/scripts/fetch_assets.py

      - name: Mix voice + BGM with sidechain ducking, loudness normalize
        run: |
          if [ -f bgm.mp3 ] && [ -s bgm.mp3 ]; then
            echo "Mixing voice + BGM with ducking"
            # Voice: normalize to -14 LUFS. BGM: -22dB, ducked further when voice present.
            ffmpeg -y -i voice.mp3 -i bgm.mp3 -filter_complex "
              [0:a]loudnorm=I=-14:TP=-1.5:LRA=11,asplit=2[vmain][vsc];
              [1:a]aloop=loop=-1:size=2e9,volume=0.16[bgmraw];
              [bgmraw][vsc]sidechaincompress=threshold=0.04:ratio=10:attack=8:release=350:makeup=1[bgmducked];
              [vmain][bgmducked]amix=inputs=2:duration=first:dropout_transition=0:weights='1 0.45'[mixed];
              [mixed]loudnorm=I=-14:TP=-1.5:LRA=11[out]
            " -map "[out]" -c:a aac -b:a 192k audio.mp3
          else
            echo "No BGM, using voice only"
            ffmpeg -y -i voice.mp3 -af "loudnorm=I=-14:TP=-1.5:LRA=11" -c:a aac -b:a 192k audio.mp3
          fi
          ls -la audio.mp3

      - name: Move audio + captions + data into remotion/public
        run: |
          mkdir -p remotion/public
          cp audio.mp3 remotion/public/audio.mp3
          # Embed captions inline into data.json for Remotion
          jq --slurpfile caps captions.json '. + { audio_url: "audio.mp3", captions: $caps[0] }' data.json > remotion/public/data.json
          echo "Captions count:" && jq '.captions | length' remotion/public/data.json

      - name: Install Remotion deps
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Render MP4
        working-directory: remotion
        run: node scripts/render.mjs

      - name: Inject anti-detection metadata + subtle film grain
        run: |
          mkdir -p out
          IN=$(find . -maxdepth 4 -name 'output.mp4' | head -1)
          if [ -z "$IN" ]; then echo "no output.mp4"; exit 1; fi
          ffmpeg -y -i "$IN" \
            -vf "noise=alls=2:allf=t" \
            -metadata make="Apple" \
            -metadata model="iPhone 15 Pro" \
            -metadata software="iOS 18.2.1" \
            -metadata location="+23.7806+090.4193/" \
            -metadata creation_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -c:v libx264 -preset fast -crf 22 -c:a aac -b:a 192k \
            out/final.mp4
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentix-video-${{ github.event.client_payload.job_id }}
          path: out/final.mp4
          retention-days: 14

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.client_payload.title }}
          CAPTION: ${{ github.event.client_payload.caption }}
          HASHTAGS: ${{ github.event.client_payload.hashtags }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            FULL_CAP="🎬 ${TITLE}"
            if [ -n "$CAPTION" ]; then FULL_CAP="${FULL_CAP}

${CAPTION}"; fi
            if [ -n "$HASHTAGS" ]; then FULL_CAP="${FULL_CAP}

${HASHTAGS}"; fi
            curl -sS -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "caption=$FULL_CAP" \
              -F "video=@out/final.mp4" \
              "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" > telegram_response.json || true
            cat telegram_response.json || true
            jq -r '.result.message_id // empty' telegram_response.json > telegram_message_id.txt || true
          else
            : > telegram_message_id.txt
          fi

      - name: Notify Lovable callback (success)
        if: success()
        env:
          CB: ${{ github.event.client_payload.callback_url }}
          JOB: ${{ github.event.client_payload.job_id }}
          SCRIPT: ${{ github.event.client_payload.script_id }}
          SIG: ${{ github.event.client_payload.signature }}
          ARTIFACT_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          TG_MSG=""
          if [ -f telegram_message_id.txt ]; then TG_MSG=$(cat telegram_message_id.txt); fi
          curl -sS -X POST "$CB" -H "Content-Type: application/json" -d "{
            \"job_id\": \"$JOB\",
            \"script_id\": \"$SCRIPT\",
            \"signature\": \"$SIG\",
            \"status\": \"succeeded\",
            \"video_url\": \"$ARTIFACT_URL\",
            \"github_run_id\": \"${{ github.run_id }}\",
            \"telegram_message_id\": \"$TG_MSG\"
          }" || true

      - name: Notify Lovable callback (failure)
        if: failure()
        env:
          CB: ${{ github.event.client_payload.callback_url }}
          JOB: ${{ github.event.client_payload.job_id }}
          SCRIPT: ${{ github.event.client_payload.script_id }}
          SIG: ${{ github.event.client_payload.signature }}
        run: |
          curl -sS -X POST "$CB" -H "Content-Type: application/json" -d "{
            \"job_id\": \"$JOB\",
            \"script_id\": \"$SCRIPT\",
            \"signature\": \"$SIG\",
            \"status\": \"failed\",
            \"error\": \"render failed; see run ${{ github.run_id }}\",
            \"github_run_id\": \"${{ github.run_id }}\"
          }" || true
